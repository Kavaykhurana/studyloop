# Render Blueprint for the deployment that is live: one Docker web service built from the repository root
# (the root Dockerfile bundles the React app into the Spring Boot jar, so UI and /api share one origin).
# Paths are relative to the repository root. For an API-only service use dockerContext: backend and
# dockerfilePath: ./backend/Dockerfile, and host the frontend separately (frontend/vercel.json).
services:
  - type: web
    name: studyloop
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FAST_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-2
      - key: GEMINI_CHAT_THINKING
        value: low
      - key: GEMINI_FAST_THINKING
        value: minimal
      - key: SIM_DUPLICATE_THRESHOLD
        value: "0.82"
      - key: SIM_GROUNDING_THRESHOLD
        value: "0.72"
      - key: SIM_SEMANTIC_FLOOR
        value: "0.64"
      - key: SIM_SEMANTIC_CEIL
        value: "0.75"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://studyloop-bi2z.onrender.com
