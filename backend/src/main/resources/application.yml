server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    multipart:
      max-file-size: 4MB
      file-size-threshold: 5MB
      max-request-size: 5MB
spring:
  application:
    name: studyloop-api
  threads:
    virtual:
      enabled: true
  jmx:
    enabled: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
    fast-model: ${GEMINI_FAST_MODEL:gemini-3-flash-preview}
    embed-model: ${GEMINI_EMBED_MODEL:gemini-embedding-2}
    # Thinking models default to long reasoning (30 s+ per call); these keep every call inside its timeout.
    chat-thinking: ${GEMINI_CHAT_THINKING:low}
    fast-thinking: ${GEMINI_FAST_THINKING:minimal}
  similarity:
    # Calibrated on gemini-embedding-2 with scripts/calibrate_similarity.py (docs/ARCHITECTURE.md, section 8)
    duplicate-threshold: ${SIM_DUPLICATE_THRESHOLD:0.82}
    grounding-threshold: ${SIM_GROUNDING_THRESHOLD:0.72}
    semantic-floor: ${SIM_SEMANTIC_FLOOR:0.64}
    semantic-ceil: ${SIM_SEMANTIC_CEIL:0.75}
  # Used only when GEMINI_API_KEY is blank: calibrated for the bag-of-words fake embedder on the seeded campus.
  fake-similarity:
    duplicate-threshold: ${SIM_FAKE_DUPLICATE_THRESHOLD:0.45}
    grounding-threshold: ${SIM_FAKE_GROUNDING_THRESHOLD:0.30}
    semantic-floor: ${SIM_FAKE_SEMANTIC_FLOOR:0.20}
    semantic-ceil: ${SIM_FAKE_SEMANTIC_CEIL:0.60}
  demo:
    enabled: ${DEMO_MODE:false}
    seed: ${SEED_DEMO:false}
    admin-token: ${ADMIN_TOKEN:}
  version:
    git-sha: ${RENDER_GIT_COMMIT:local}
